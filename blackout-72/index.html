  /* ───────── 입자 ───────── */
  const cvs = $('particles'), ctx = cvs.getContext('2d');

    const n = { snow: 90, dust: 40, ember: 60 }[ptype] || 0;
    for (let i = 0; i < n; i++) parts.push({ x: Math.random(), y: Math.random(), s: Math.random() * .8 + .4, o: Math.random() * Math.PI * 2 });
  }
  function tick() {
    const w = cvs.width, h = cvs.height; ctx.clearRect(0, 0, w, h);
    for (const p of parts) {
      if (ptype === 'snow') { p.y += .0012 * p.s; p.x += Math.sin(p.o += .01) * .0004; ctx.fillStyle = 'rgba(255,255,255,.75)'; }
      if (ptype === 'dust') { p.y -= .00012 * p.s; p.x += Math.sin(p.o += .006) * .0003; ctx.fillStyle = 'rgba(255,236,190,.35)'; }
      if (ptype === 'ember') { p.y -= .0016 * p.s; p.x += Math.sin(p.o += .03) * .0008; ctx.fillStyle = 'rgba(255,150,80,.8)'; }
      if (p.y > 1.02) p.y = -.02; if (p.y < -.02) p.y = 1.02; if (p.x > 1) p.x = 0; if (p.x < 0) p.x = 1;

  /* ───────── 상태 ───────── */

  }

    st.log.push({ time: n.time.split('·')[0].trim(), label: c.label });
    let next = c.next;
    if (Object.values(st.stats).some(v => v <= 0)) next = 'collapse';
    if (r.endings[next]) { st.node = next; return enterEnding(); }
    if (r.nodes[next]) { st.node = next; panel.innerHTML = hud() + `<div class="dlg"><span class="name narr">선택</span><div class="text narr">${esc(c.label)}</div></div>`; return setTimeout(enterNode, 900); }
    console.warn('없는 장면 id:', next); st.node = 'collapse'; enterEnding();
  }
  function enterEnding() {
    const r = role(), e = r.endings[st.node]; st.screen = 'ending';
    $('meta').textContent = `${r.name} · ENDING`;
    panel.innerHTML = hud() + `<div class="dlg"><span class="name narr">선택</span><div class="text narr">${esc(st.log[st.log.length - 1].label)}</div></div>`;
    setTimeout(() => {
      setBg(e.bg || 'dawn'); setCast([]);
      showCard('ENDING', e.title, () => playLines(e.text.split('\n').map(t => ({ who: '', text: t })), endCard));
    }, 900);
  }
  function endCard() {
    const r = role(), e = r.endings[st.node]; st.screen = 'end'; st.last = {};
    panel.innerHTML = `${hud()}<div class="endcard"><div class="tone ${e.tone}">${{ good: '■ 안정된 결말', mixed: '■ 불완전한 결말', bad: '■ 실패한 결말' }[e.tone]}</div><h2>${esc(e.title)}</h2>
      <div class="log">${st.log.map(l => `<div><span>${esc(l.time)}</span><span>${esc(l.label)}</span></div>`).join('')}</div>
      <div class="actions"><button class="btn" id="again">같은 역할로 다시</button><button class="btn ghost" id="other">다른 역할</button></div></div>`;
    $('again').onclick = () => startRole(st.role);
    $('other').onclick = () => { $('titlebig').style.opacity = 1; setBg('dmz'); setCast([]); roleSelect(); };
  }

  /* ───────── 조작 ───────── */
  stage.onclick = advance;
  document.addEventListener('keydown', e => {
    if ((e.key === ' ' || e.key === 'Enter') && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); advance(); }
    if (st.screen === 'choice' && /^[1-4]$/.test(e.key)) { const b = panel.querySelectorAll('.choice')[+e.key - 1]; b && b.click(); }
  });
  const tog = (id, k) => { const b = $(id); b.onclick = () => { opt[k] = !opt[k]; b.setAttribute('aria-pressed', opt[k]); if (k === 'auto' && opt.auto && !typing) waitTimer = setTimeout(advance, 600); if (k === 'auto' && !opt.auto) clearTimeout(waitTimer); }; };
  tog('bAuto', 'auto'); tog('bFast', 'fast'); tog('bSound', 'sound');
  $('bHome').onclick = () => { clearInterval(typing); typing = null; clearTimeout(waitTimer); title(); };

  window.addEventListener('resize', sizeCanvas);
  sizeCanvas(); requestAnimationFrame(tick);

  window.claude?.hot?.snapshot?.(() => ({ role: st.role, node: st.node, stats: st.stats, log: st.log, screen: st.screen }));
  const boot = d => {
    if (d && d.role && S.roles.find(r => r.id === d.role) && (d.screen === 'play' || d.screen === 'choice')) {
      const r = S.roles.find(x => x.id === d.role);
      if (r.nodes[d.node]) { st = { screen: 'play', role: d.role, node: d.node, li: 0, stats: d.stats, log: d.log || [], last: {}, ending: null }; $('titlebig').style.opacity = 0; enterNode(); return; }
    }
    title();
  };
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>

</body></html>
